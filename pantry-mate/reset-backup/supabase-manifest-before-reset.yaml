        app.kubernetes.io/instance: supabase-dev
    spec:
      serviceAccountName: supabase-dev-supabase-db
      automountServiceAccountToken: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        null
      nodeSelector:
        role: postgres
      initContainers:
        - name: init-pgsodium
          image: "supabase/postgres:17.6.1.136"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Initializing pgsodium persistent config directory..."
              if [ -z "$(ls -A /mnt/pgsodium 2>/dev/null)" ]; then
                echo "pgsodium volume is empty, copying default postgresql-custom files..."
                cp -a /etc/postgresql-custom/. /mnt/pgsodium/
              else
                echo "pgsodium volume already initialized, skipping copy"
              fi
          volumeMounts:
            - mountPath: /mnt/pgsodium
              name: pgsodium
          securityContext:
            {}
        - name: init-db
          image: "supabase/postgres:17.6.1.136"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Copying init scripts into existing image script directory..."
              cp -r /docker-entrypoint-initdb.d/* /initdb.d/
              cp /custom-init-scripts/98-webhooks.sql /initdb.d/init-scripts/
              cp /custom-init-scripts/99-roles.sql /initdb.d/init-scripts/
              cp /custom-init-scripts/99-jwt.sql /initdb.d/init-scripts/

              cp /custom-init-scripts/99-logs.sql /initdb.d/migrations/
              cp /custom-init-scripts/99-realtime.sql /initdb.d/migrations/
              cp /custom-init-scripts/97-_supabase.sql /initdb.d/migrations/
              cp /custom-init-scripts/99-pooler.sql /initdb.d/migrations/

              echo "Copying user-defined migration scripts..."
              cp /custom-migrations/* /initdb.d/migrations/ || echo "Skip migrations"
              echo "Initialization scripts are ready"
          volumeMounts:
            - mountPath: /custom-init-scripts
              name: custom-init-scripts
            - mountPath: /custom-migrations
              name: custom-migrations
            - mountPath: /initdb.d
              name: initdb-scripts-data
          securityContext:
            {}
      containers:
        - name: supabase-db
          image: "supabase/postgres:17.6.1.136"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5432
              protocol: TCP
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: supabase-core
                  key: dbPassword
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: supabase-core
                  key: dbPassword
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: supabase-core
                  key: database
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: supabase-core
                  key: database
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: supabase-core
                  key: jwtSecret
            
            - name: POSTGRES_HOST
              value: "/var/run/postgresql"
            - name: PGPORT
              value: "5432"
            - name: POSTGRES_PORT
              value: "5432"
            - name: JWT_EXP
              value: "3600"
          resources:
            limits:
              cpu: "1"
              memory: 1536Mi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - mountPath: /docker-entrypoint-initdb.d
              name: initdb-scripts-data
            - mountPath: /etc/postgresql-custom
              name: pgsodium
            - mountPath: /var/lib/postgresql/data
              name: postgres-volume
              subPath: postgres-data
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "pg_ctl -D /var/lib/postgres/data -w -t 60 -m fast stop"]
          securityContext:
            {}
      volumes:
        - name: initdb-scripts-data
          emptyDir:
            medium: ""
        - name: custom-init-scripts
          configMap:
            name: supabase-dev-supabase-db-initdb
        - name: custom-migrations
          configMap:
            name: supabase-dev-supabase-db-migrations
        - name: pgsodium
          persistentVolumeClaim:
            claimName: supabase-dev-pgsodium
        - name: postgres-volume
          persistentVolumeClaim:
            claimName: supabase-dev-db


