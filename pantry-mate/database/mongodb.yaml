apiVersion: v1
kind: Service
metadata:
  name: pantry-mongodb
  namespace: database
spec:
  clusterIP: None
  selector:
    app: pantry-mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pantry-mongodb
  namespace: database
spec:
  serviceName: pantry-mongodb
  replicas: 1

  selector:
    matchLabels:
      app: pantry-mongodb

  template:
    metadata:
      labels:
        app: pantry-mongodb

    spec:
      nodeSelector:
        role: mongodb

      containers:
        - name: mongodb
          image: mongo:8.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: mongodb
              containerPort: 27017

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pantry-mongodb-auth
                  key: username

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pantry-mongodb-auth
                  key: password

            - name: MONGO_INITDB_DATABASE
              value: pantry

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
