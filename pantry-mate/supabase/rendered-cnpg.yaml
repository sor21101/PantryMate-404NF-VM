    spec:
      serviceAccountName: supabase-dev-supabase-functions
      automountServiceAccountToken: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      securityContext:
        null
      containers:
        - name: supabase-functions
          image: "supabase/edge-runtime:v1.74.0"
          imagePullPolicy: IfNotPresent
          args:
            - start
            - --main-service
            - /home/deno/functions/main
          env:
            - name: SUPABASE_URL
              value: http://supabase-dev-supabase-kong:8000

            - name: DB_DRIVER
              value: "postgresql"
            - name: DB_USERNAME
              value: "postgres"
            - name: DB_SSL
              value: "disable"
