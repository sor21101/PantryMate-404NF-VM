              valueFrom:
                secretKeyRef:
                  name: supabase-external-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: supabase-external-db
                  key: port
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: supabase-external-db
                  key: password
            - name: DB_PASSWORD_ENC
              valueFrom:
                secretKeyRef:
                  name: supabase-external-db
                  key: password
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: supabase-external-db
                  key: database
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: supabase-jwt
                  key: secret
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: supabase-jwt
                  key: anonKey
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: supabase-jwt
                  key: serviceKey
            - name: SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: supabase-dev-apikey
                  key: publishableKey
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: supabase-dev-apikey
                  key: secretKey
            - name: SUPABASE_PUBLISHABLE_KEYS
              value: '{"default":"$(SUPABASE_PUBLISHABLE_KEY)"}'
            - name: SUPABASE_SECRET_KEYS
              value: '{"default":"$(SUPABASE_SECRET_KEY)"}'
            - name: SUPABASE_DB_URL
              value: $(DB_DRIVER)://$(DB_USERNAME):$(DB_PASSWORD_ENC)@$(DB_HOSTNAME):$(DB_PORT)/$(DB_DATABASE)?search_path=auth&sslmode=$(DB_SSL)
            
            - name: VERIFY_JWT
              value: "false"
          volumeMounts:
            - name: functions-storage
              mountPath: /home/deno/functions
            - name: deno-cache
              mountPath: /root/.cache/deno
            - mountPath: /home/deno/functions/main/index.ts
              name: functions-main
              subPath: index.ts
          securityContext:
            {}
      volumes:
        - name: functions-storage
          persistentVolumeClaim:
            claimName: supabase-dev-functions
        - name: deno-cache
          persistentVolumeClaim:
            claimName: supabase-dev-deno
        - name: functions-main
          configMap:
            name: supabase-dev-supabase-functions-main

