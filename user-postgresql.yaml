apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: user-postgresql
  namespace: database

spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:17

  bootstrap:
    initdb:
      database: pantrymate_user
      owner: user_app
      secret:
        name: user-postgresql-app

  storage:
    storageClass: local-path
    size: 20Gi

  affinity:
    nodeSelector:
      db-ha: enabled

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
